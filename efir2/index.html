<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Эфир №2 · Гормоны, которые мешают худеть</title>
<style>
:root{--bg:#0f2b33;--fg:#fff;--muted:#9fc7cf}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
#stage{position:fixed;inset:0 0 44px 0;display:flex;align-items:center;justify-content:center}
#stage img{max-width:100%;max-height:100%;object-fit:contain;box-shadow:0 8px 40px rgba(0,0,0,.4);border-radius:8px}
#bar{position:fixed;left:0;right:0;bottom:0;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:14px;color:var(--muted);background:rgba(0,0,0,.25)}
button{background:#1f8a96;color:#fff;border:0;border-radius:8px;padding:8px 14px;font-size:15px;cursor:pointer}
#cap{flex:1;text-align:center;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zone{position:fixed;top:0;bottom:44px;width:30%;cursor:pointer}#l{left:0}#r{right:0}
</style></head><body>
<div id="stage"><img id="img" alt=""></div>
<div class="zone" id="l"></div><div class="zone" id="r"></div>
<div id="bar"><button id="prev">←</button><span id="cap"></span><button id="fs">⛶</button><button id="next">→</button></div>
<script>
const S=[
["efir2/01_afisha.jpg","0–7 мин · Приветствие, первые результаты"],
["slides/day5_thyroid.jpg","7–14 мин · Щитовидная железа и кортизол"],
["slides/day5_stress.jpg","7–14 мин · Щитовидная железа и стресс"],
["slides/metafoodbiom_ves.jpg","14–20 мин · Почему вес и сахар зависят от кишечника"],
["slides/ievskaya_vtoroy_mozg.jpg","14–20 мин · Кишечник — второй мозг (дыхание 4/6 вместе)"],
["slides/metafoodbiom.jpg","14–20 мин · МетаФудБиом от Agenyz"],
["slides/shema_priema_new.jpg","20–26 мин · Тарелки из чата + схема приёма"],
["efir2/09_affirm.jpg","26–30 мин · Аффирмация, вопросы, замер талии"]];
const base=location.pathname.replace(/efir2\/?(index\.html)?$/,'');
S.forEach(s=>{const i=new Image();i.src=base+s[0]});
let i=0;try{i=+localStorage.getItem('efir2')||0}catch(e){}
const show=()=>{i=Math.max(0,Math.min(S.length-1,i));img.src=base+S[i][0];cap.textContent=(i+1)+' / '+S.length+' · '+S[i][1];try{localStorage.setItem('efir2',i)}catch(e){}};
prev.onclick=l.onclick=()=>{i--;show()};next.onclick=r.onclick=()=>{i++;show()};
fs.onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){i++;show()}if(['ArrowLeft','PageUp'].includes(e.key)){i--;show()}});
show();
</script></body></html>
